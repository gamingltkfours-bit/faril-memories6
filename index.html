<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Our Memories 💗</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;500&display=swap">
<style>
:root{--pink:#ff4d9d;--pink2:#ff8fc4;--bg:#09090b;--panel:rgba(22,16,24,.72);--line:rgba(255,77,157,.35);--txt:#fff0f6;color-scheme:dark}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--txt);font-family:'Poppins',system-ui,sans-serif;-webkit-tap-highlight-color:transparent;padding-top:env(safe-area-inset-top,0)}
#bg{position:fixed;inset:0;z-index:-2;background:radial-gradient(circle at 20% 10%,#4a0f2c 0,#14060d 45%,#09090b 100%) center/cover no-repeat}
#bgov{position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(9,9,11,.55),rgba(9,9,11,.8))}
button{font:inherit;cursor:pointer;border:0;color:inherit}
.btn{background:linear-gradient(135deg,var(--pink),#c2185b);padding:10px 18px;border-radius:99px;font-weight:500;box-shadow:0 4px 18px rgba(255,77,157,.35)}
.ghost{background:rgba(255,255,255,.08);border:1px solid var(--line);padding:9px 14px;border-radius:99px;font-size:13px}
#lock{position:fixed;inset:0;z-index:50;background:radial-gradient(circle at 50% 0,#3a0a22,#09090b 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px;overflow:hidden}
#lock h2{font-family:'Dancing Script',cursive;font-size:38px;margin:0;color:var(--pink2)}
#lock p{margin:0;font-size:13px;opacity:.7}
.dots{display:flex;gap:14px;height:16px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--pink);transition:.15s}
.dots i.on{background:var(--pink);box-shadow:0 0 12px var(--pink)}
.dots.bad{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:12px}
.pad button{height:72px;border-radius:50%;background:rgba(255,255,255,.06);border:1px solid var(--line);font-size:24px}
.pad button:active{background:var(--pink)}
.heart{position:absolute;bottom:-30px;color:var(--pink);opacity:.5;animation:rise linear infinite;pointer-events:none}
@keyframes rise{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
#app{display:none;max-width:1100px;margin:0 auto;padding:28px 16px 130px}
header{text-align:center;margin-bottom:22px}
#title{font-family:'Dancing Script',cursive;font-size:clamp(38px,9vw,64px);margin:0;color:var(--pink2);text-shadow:0 0 24px rgba(255,77,157,.55);outline:0}
#sub{font-size:13px;opacity:.7;margin-top:4px}
#warn{display:none;text-align:center;background:var(--panel);border:1px solid var(--pink);border-radius:14px;padding:12px;margin-bottom:14px;font-size:13px}
.tabs{display:flex;gap:8px;justify-content:center;margin-bottom:18px}
.tab{background:rgba(255,255,255,.07);border:1px solid var(--line);padding:8px 22px;border-radius:99px}.tab.on{background:var(--pink)}
.bar{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:0 0 22px}
#grid{columns:2 150px;column-gap:12px}
@media(min-width:700px){#grid{columns:4}}
.ph{break-inside:avoid;margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#1a1018;cursor:pointer;transition:transform .2s}
.ph:hover{transform:translateY(-3px)}
.ph img{display:block;width:100%;height:auto}
#empty{text-align:center;opacity:.7;padding:50px 10px;display:none}
#trash{display:none;margin-top:26px;padding:14px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
#trash .it{display:inline-block;margin:6px;text-align:center;vertical-align:top}
#trash img{width:84px;height:84px;object-fit:cover;border-radius:10px;display:block;margin-bottom:6px}
.tr{display:flex;align-items:center;gap:10px;padding:12px;margin-bottom:8px;border-radius:12px;background:var(--panel);border:1px solid var(--line);cursor:pointer}
.tr.cur{border-color:var(--pink);box-shadow:0 0 14px rgba(255,77,157,.4)}
.tr span{flex:1;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr b{font-weight:400;font-size:12px;opacity:.8}
#lb{position:fixed;inset:0;z-index:40;background:rgba(5,3,6,.94);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
#lb img{max-width:100%;max-height:70vh;border-radius:14px;box-shadow:0 0 40px rgba(255,77,157,.3)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.nav{position:absolute;top:50%;background:rgba(255,255,255,.1);width:42px;height:42px;border-radius:50%;font-size:20px}
#player{position:fixed;left:0;right:0;bottom:0;z-index:30;display:none;align-items:center;gap:10px;justify-content:center;flex-wrap:wrap;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0));background:var(--panel);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
#player button{background:rgba(255,255,255,.08);width:38px;height:38px;border-radius:50%}
#player #pp{background:var(--pink);width:44px;height:44px}
#tname{font-size:13px;min-width:120px;max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#vol{width:80px;accent-color:var(--pink)}
#toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0));transform:translateX(-50%);z-index:60;background:#2a0f1c;border:1px solid var(--pink);padding:10px 16px;border-radius:12px;font-size:13px;display:none;max-width:90%}
#rain{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#app{position:relative;z-index:1}
.rh{position:absolute;top:-40px;will-change:transform;animation:fall linear forwards;text-shadow:0 0 8px currentColor}
@keyframes fall{0%{transform:translate3d(0,0,0) rotate(0);opacity:0}10%{opacity:.9}100%{transform:translate3d(var(--dx),115vh,0) rotate(var(--rot));opacity:.25}}
.dinp{background:rgba(255,255,255,.08);border:1px solid var(--line);color:var(--txt);padding:8px 12px;border-radius:12px;font:inherit;font-size:13px;color-scheme:dark}
.ph{position:relative}
.cap{position:absolute;left:0;right:0;bottom:0;padding:18px 8px 6px;font-size:11px;text-align:center;background:linear-gradient(transparent,rgba(0,0,0,.78))}
#mem{position:fixed;inset:0;z-index:45;background:radial-gradient(circle,#1a0510,#000);display:none}
.mimg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity 1s}
.mimg.on{opacity:1}
#mcap{position:absolute;left:0;right:0;bottom:90px;text-align:center;padding:0 20px;font-family:'Dancing Script',cursive;font-size:26px;text-shadow:0 2px 12px #000}
#mctl{position:absolute;left:0;right:0;bottom:calc(20px + env(safe-area-inset-bottom,0));display:flex;gap:14px;justify-content:center}
#mctl button{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.12);border:1px solid var(--line)}
.alt{background:rgba(255,77,157,.16);border:1px solid var(--pink);box-shadow:none}
#menu{display:none;max-width:360px;margin:-8px auto 22px;padding:10px;border-radius:16px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(14px)}
#menu.open{display:block}
.mgrp{font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.55;margin:8px 8px 4px}
.mi{display:block;width:100%;text-align:left;background:none;padding:11px 12px;border-radius:10px;font-size:14px}
.mi:hover,.mi:active{background:rgba(255,77,157,.18)}
.lx{position:absolute;top:calc(14px + env(safe-area-inset-top,0));right:14px;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.12);font-size:18px}
.dcard{position:relative;display:inline-block;min-width:250px;max-width:92%;padding:16px 28px 14px;border-radius:22px;background:linear-gradient(160deg,rgba(255,77,157,.2),rgba(22,16,24,.72));border:1px solid var(--line);backdrop-filter:blur(10px);box-shadow:0 0 30px rgba(255,77,157,.18);cursor:pointer}
.dheart{font-size:26px;display:inline-block;animation:beat 1.4s ease-in-out infinite;filter:drop-shadow(0 0 8px var(--pink))}
@keyframes beat{0%,70%,100%{transform:scale(1)}14%{transform:scale(1.28)}42%{transform:scale(1.18)}}
.dnum{font-family:'Dancing Script',cursive;font-size:clamp(54px,15vw,80px);line-height:1;font-weight:700;background:linear-gradient(90deg,#ff8fc4,#fff,#ff4d9d,#ff8fc4);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:shine 4s linear infinite}
@keyframes shine{to{background-position:-250% 0}}
.dlbl{font-size:12px;letter-spacing:.2em;text-transform:uppercase;opacity:.8}
.dsub{font-size:13px;opacity:.8;margin-top:6px}
.dbar{height:6px;border-radius:9px;background:rgba(255,255,255,.1);margin:12px auto 6px;max-width:220px;overflow:hidden}
.dbar i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,var(--pink),var(--pink2));transition:width 1.6s cubic-bezier(.2,.8,.2,1)}
.dnext{font-size:12px;opacity:.8}
.dcard.party{border-color:var(--pink);animation:glow 2s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 48px rgba(255,77,157,.65)}}
.bh{position:absolute;left:50%;top:40%;pointer-events:none;color:var(--pink);animation:burst 1.8s ease-out forwards;text-shadow:0 0 8px currentColor;z-index:5}
@keyframes burst{0%{transform:translate(-50%,-50%) scale(.3);opacity:1}100%{transform:translate(calc(-50% + var(--bx)),calc(-50% + var(--by))) scale(1.2) rotate(var(--br));opacity:0}}
@media (prefers-reduced-motion:reduce){.dheart,.dnum,.dcard.party{animation:none}.bh{display:none}}
</style>
</head>
<body>
<div id="bg"></div><div id="bgov"></div><div id="toast"></div><div id="rain"></div>

<div id="lock">
  <h2>Our Memories</h2>
  <p>Masukkan PIN untuk masuk 💗</p>
  <div class="dots" id="dots"><i></i><i></i><i></i><i></i><i></i></div>
  <div class="pad" id="pad"></div>
</div>

<div id="app">
  <header>
    <h1 id="title" contenteditable="true" spellcheck="false">Kita Berdua</h1>
    <div id="sub"><span id="count">0</span> kenangan tersimpan · ketuk judul untuk mengubahnya</div>
    <div id="days" style="margin-top:10px"></div>
  </header>
  <div id="warn"></div>
  <div class="tabs"><button class="tab on" id="tabP">📷 Foto</button><button class="tab" id="tabM">🎵 Musik</button></div>

  <div id="secP">
    <div class="bar">
      <button class="btn" id="addPhoto">＋ Tambah Foto</button>
      <button class="btn alt" id="memBtn">▶ Putar Kenangan</button>
      <button class="ghost" id="menuBtn">⋯ Lainnya</button>
    </div>
    <div id="menu">
      <div class="mgrp">Latar belakang</div>
      <button class="mi" id="bgPick">🖼 Latar dari Foto</button>
      <button class="mi" id="bgSlide">🔀 Slideshow: mati</button>
      <button class="mi" id="resetBg">↺ Reset Latar</button>
      <div class="mgrp">Tampilan</div>
      <button class="mi" id="rainBtn">💗 Hujan Love: nyala</button>
      <button class="mi" id="annivBtn">📅 Atur tanggal jadian</button>
      <div id="annivRow" style="display:none;gap:8px;padding:4px 8px 8px;flex-wrap:wrap"><input type="date" id="annivIn" class="dinp"><button class="btn" id="annivSave">Simpan</button></div>
      <div class="mgrp">Simpanan</div>
      <button class="mi" id="dlAll">⬇ Unduh Semua</button>
      <button class="mi" id="trashBtn">♻ Sampah (<span id="tc">0</span>)</button>
    </div>
    <div id="grid"></div>
    <div id="empty">Belum ada foto 📷<br>Tambahkan foto pertama kalian.</div>
    <div id="trash"></div>
  </div>

  <div id="secM" style="display:none">
    <div class="bar"><button class="btn" id="addM">＋ Tambah Musik</button></div>
    <div id="tlist"></div>
  </div>
  <input type="file" id="fp" accept="image/*" multiple hidden>
  <input type="file" id="fb" accept="image/*" hidden>
  <input type="file" id="fm" accept="audio/*,video/mp4" multiple hidden>
</div>

<div id="lb">
  <button class="nav" id="lprev" style="left:10px">‹</button>
  <button class="nav" id="lnext" style="right:10px">›</button>
  <img id="limg" alt="Foto kenangan">
  <div id="lcap" style="font-size:14px;text-align:center;opacity:.9;min-height:18px"></div>
  <div class="row" id="capEdit" style="display:none"><input id="capIn" class="dinp" placeholder="Keterangan foto…" maxlength="140"><input type="date" id="dateIn" class="dinp"><button class="btn" id="capSave">Simpan</button></div>
  <button class="lx" id="lclose">✕</button>
  <div class="row">
    <button class="ghost" id="dl">⬇ Simpan</button>
    <button class="ghost" id="capBtn">✏ Ubah</button>
    <button class="ghost" id="setbg">🖼 Latar</button>
    <button class="ghost" id="del">🗑 Hapus</button>
  </div>
</div>

<div id="mem"><img id="mA" class="mimg" alt=""><img id="mB" class="mimg" alt=""><div id="mcap"></div>
  <div id="mctl"><button id="mprev">⏮</button><button id="mpp">⏸</button><button id="mnext">⏭</button><button id="mx">✕</button></div></div>

<div id="player">
  <button id="prev">⏮</button><button id="pp">▶</button><button id="next">⏭</button>
  <span id="tname">Melodi Bawaan</span>
  <input type="range" id="vol" min="0" max="1" step="0.05" value="0.6">
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
/* ===== ISI DUA BARIS INI (dari Supabase: Project Settings > API) ===== */
const SB_URL='https://oszondaabgomtffklvzw.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9zem9uZGFhYmdvbXRmZmtsdnp3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI5NDgzMjEsImV4cCI6MjEwODUyNDMyMX0.OsDJlfWnLGzZ2-mVX_frO1QHnsPbfJw18bfPac8w_1o';
/* ====================================================================== */
const PIN='10926',BUCKET='memories';
const $=s=>document.querySelector(s);
const configured=!SB_URL.startsWith('ISI');
const sb=configured&&window.supabase?supabase.createClient(SB_URL,SB_KEY):null;
let photos=[],trashP=[],tracks=[],trashT=[],settings={},li=0,ci=0,playing=false,vol=.6,si=0;
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',3500)}
function ss(k,v){try{return v===undefined?sessionStorage.getItem(k):sessionStorage.setItem(k,v)}catch(e){return null}}
const NOCONN='Belum terhubung ke Supabase. Isi SB_URL dan SB_KEY di kode.';

/* ---------- PIN ---------- */
let entered='';
['1','2','3','4','5','6','7','8','9','','0','⌫'].forEach(k=>{
  const b=document.createElement('button');b.textContent=k;if(!k)b.style.visibility='hidden';
  b.onclick=()=>press(k);$('#pad').appendChild(b);
});
function dots(){document.querySelectorAll('#dots i').forEach((d,i)=>d.classList.toggle('on',i<entered.length))}
function press(k){
  if(k==='⌫')entered=entered.slice(0,-1);else if(entered.length<5)entered+=k;
  dots();
  if(entered.length===5){
    if(entered===PIN){ss('ok','1');unlock()}
    else{const d=$('#dots');d.classList.add('bad');setTimeout(()=>{d.classList.remove('bad');entered='';dots()},450)}
  }
}
for(let i=0;i<14;i++){const h=document.createElement('span');h.className='heart';h.textContent='♥';
  h.style.left=Math.random()*100+'%';h.style.fontSize=(12+Math.random()*22)+'px';
  h.style.animationDuration=(7+Math.random()*8)+'s';h.style.animationDelay=(-Math.random()*10)+'s';$('#lock').appendChild(h)}
document.addEventListener('keydown',e=>{if($('#lock').style.display!=='none'){if(/^\d$/.test(e.key))press(e.key);if(e.key==='Backspace')press('⌫')}});
function unlock(){$('#lock').style.display='none';$('#app').style.display='block';$('#player').style.display='flex';start()}

/* ---------- data ---------- */
async function loadAll(){
  if(!sb)return;
  const [p,t,s]=await Promise.all([
    sb.from('photos').select('*').order('created_at',{ascending:false}),
    sb.from('tracks').select('*').order('created_at'),
    sb.from('settings').select('*').eq('id',1).maybeSingle()]);
  if(p.error||t.error){toast('Gagal memuat: '+(p.error||t.error).message);return}
  photos=p.data.filter(x=>!x.deleted);trashP=p.data.filter(x=>x.deleted);
  const pid=(allTracks()[ci]||{}).id;
  tracks=t.data.filter(x=>!x.deleted);trashT=t.data.filter(x=>x.deleted);
  const i=allTracks().findIndex(x=>x.id===pid);ci=i<0?0:i;
  settings=s.data||{};render();
}
let rt;
function start(){
  if(!sb){$('#warn').textContent=NOCONN;$('#warn').style.display='block';render();return}
  loadAll();
  ['photos','tracks','settings'].forEach(t=>sb.channel('rt-'+t).on('postgres_changes',{event:'*',schema:'public',table:t},()=>{clearTimeout(rt);rt=setTimeout(loadAll,300)}).subscribe());
  setInterval(loadAll,30000);
}
async function up(blob,folder,ext,type){
  const path=folder+'/'+Date.now()+'-'+Math.random().toString(36).slice(2,7)+'.'+ext;
  const r=await sb.storage.from(BUCKET).upload(path,blob,{contentType:type});
  if(r.error)throw r.error;
  return {path,url:sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl};
}
async function shrink(file){
  try{
    const bm=await createImageBitmap(file),r=Math.min(1,1800/Math.max(bm.width,bm.height));
    const c=document.createElement('canvas');c.width=Math.round(bm.width*r);c.height=Math.round(bm.height*r);
    c.getContext('2d').drawImage(bm,0,0,c.width,c.height);
    return await new Promise(res=>c.toBlob(b=>res(b||file),'image/jpeg',.86));
  }catch(e){return file}
}
async function savePhoto(file){
  const f=await up(await shrink(file),'photos','jpg','image/jpeg');
  const r=await sb.from('photos').insert({url:f.url,path:f.path});if(r.error)throw r.error;
  return f.url;
}
const setSet=o=>sb.from('settings').update(o).eq('id',1).then(r=>{if(r.error)toast('Gagal: '+r.error.message);else loadAll()});

/* ---------- tampilan ---------- */
function render(){
  if(document.activeElement!==$('#title'))$('#title').textContent=settings.title||'Kita Berdua';
  $('#bg').style.backgroundImage=settings.bg?'url("'+settings.bg+'")':'';
  $('#bgSlide').textContent='🔀 Slideshow: '+(settings.slide?'nyala':'mati');
  slideShow();renderDays();
  const g=$('#grid');g.innerHTML='';
  photos.forEach((p,i)=>{
    const d=document.createElement('div');d.className='ph';
    const im=document.createElement('img');im.src=p.url;im.loading='lazy';im.alt='Foto kenangan';
    d.appendChild(im);if(p.caption){const c=document.createElement('div');c.className='cap';c.textContent=p.caption;d.appendChild(c)}d.onclick=()=>{li=i;$('#lb').style.display='flex';showLb()};g.appendChild(d);
  });
  $('#count').textContent=photos.length;$('#empty').style.display=photos.length?'none':'block';
  if($('#lb').style.display==='flex')showLb();
  renderTrash();renderTracks();
}
function slideShow(){const n=photos.length;if(settings.slide&&n)$('#bg').style.backgroundImage='url("'+photos[si%n].url+'")'}
setInterval(()=>{si++;slideShow()},7000);
function renderTrash(){
  const t=$('#trash');$('#tc').textContent=trashP.length+trashT.length;
  t.innerHTML='<div style="text-align:center;margin-bottom:8px">Sampah — tidak ada yang terhapus permanen ♻</div>';
  if(!trashP.length&&!trashT.length){t.innerHTML+='<p style="text-align:center;opacity:.6;font-size:13px">Kosong</p>';return}
  const mk=(label,tbl,id,img)=>{
    const d=document.createElement('div');d.className='it';
    if(img){const im=document.createElement('img');im.src=img;im.alt='';d.appendChild(im)}
    else{const s=document.createElement('div');s.textContent='♪ '+label;s.style.margin='0 0 6px';d.appendChild(s)}
    const b=document.createElement('button');b.className='ghost';b.textContent='Pulihkan';
    b.onclick=()=>sb.from(tbl).update({deleted:false}).eq('id',id).then(loadAll);
    d.appendChild(b);t.appendChild(d)};
  trashP.forEach(p=>mk('','photos',p.id,p.url));trashT.forEach(k=>mk(k.name,'tracks',k.id));
}
$('#title').addEventListener('blur',()=>{
  const t=$('#title').textContent.trim()||'Kita Berdua';if(sb&&t!==settings.title)setSet({title:t});
});
$('#title').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();e.target.blur()}});
function tab(x){$('#secP').style.display=x==='P'?'':'none';$('#secM').style.display=x==='M'?'':'none';$('#tabP').classList.toggle('on',x==='P');$('#tabM').classList.toggle('on',x==='M')}
$('#tabP').onclick=()=>tab('P');$('#tabM').onclick=()=>tab('M');
$('#trashBtn').onclick=()=>{const t=$('#trash');t.style.display=t.style.display==='block'?'none':'block'};

/* ---------- foto ---------- */
$('#addPhoto').onclick=()=>$('#fp').click();
$('#fp').onchange=async e=>{

/* ---------- musik ---------- */
const synthTrack={id:'synth',name:'Melodi Bawaan ♡',synth:true};
const allTracks=()=>[synthTrack,...tracks];
const au=new Audio();au.onended=()=>nextTrack();
let ac,master,timer,step=0,nextT=0;
const prog=[[220,261.63,329.63],[174.61,220,261.63],[261.63,329.63,392],[196,246.94,293.66]],seq=[0,1,2,1,2,1,2,1];
function note(f,t,d,v){const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=f;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.04);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.05)}
function sched(){while(nextT<ac.currentTime+.6){const ch=prog[Math.floor(step/8)%4],i=step%8;
  note(ch[seq[i]]*2,nextT,1.1,.5);if(i===0)note(ch[0]/2,nextT,3,.7);step++;nextT+=.42}}
function startSynth(){ac=ac||new (window.AudioContext||window.webkitAudioContext)();
  if(!master){master=ac.createGain();master.connect(ac.destination)}
  master.gain.value=vol*.35;ac.resume();nextT=ac.currentTime+.05;clearInterval(timer);timer=setInterval(sched,150)}
function stopSynth(){clearInterval(timer);if(ac)ac.suspend()}
function play(){
  const t=allTracks()[ci]||synthTrack;
  if(t.synth){au.pause();startSynth()}
  else{stopSynth();au.src=t.url;au.volume=vol;au.play().catch(()=>toast('Lagu tidak bisa diputar'))}
  playing=true;ui();
}
function pause(){stopSynth();au.pause();playing=false;ui()}
function nextTrack(d=1){const n=allTracks().length;ci=(ci+d+n)%n;play()}
function ui(){const t=allTracks()[ci]||synthTrack;$('#tname').textContent=t.name;$('#pp').textContent=playing?'⏸':'▶';renderTracks()}
function renderTracks(){
  const l=$('#tlist');l.innerHTML='';
  allTracks().forEach((t,i)=>{
    const d=document.createElement('div');d.className='tr'+(i===ci?' cur':'');
    const s=document.createElement('span');s.textContent=(i===ci&&playing?'▶ ':'♪ ')+t.name;d.appendChild(s);
    d.onclick=()=>{ci=i;play()};
    if(!t.synth&&sb){const b=document.createElement('b');b.textContent='🗑';
      b.onclick=e=>{e.stopPropagation();
        if(b.dataset.a){if(i===ci){pause();ci=0}sb.from('tracks').update({deleted:true}).eq('id',t.id).then(()=>{toast('Lagu dipindah ke Sampah ♻');loadAll()})}
        else{b.dataset.a=1;b.textContent='Yakin?';setTimeout(()=>{delete b.dataset.a;b.textContent='🗑'},3000)}};
      d.appendChild(b)}
    l.appendChild(d);
  });
}
$('#pp').onclick=()=>playing?pause():play();
$('#next').onclick=()=>nextTrack(1);$('#prev').onclick=()=>nextTrack(-1);
$('#vol').oninput=e=>{vol=+e.target.value;au.volume=vol;if(master)master.gain.value=vol*.35};
$('#addM').onclick=()=>$('#fm').click();
$('#fm').onchange=async e=>{
  const files=[...e.target.files];e.target.value='';if(!files.length)return;if(!sb)return toast(NOCONN);
  for(const f of files){
    try{
      toast('Mengunggah '+f.name+'…');
      const ext=(f.name.split('.').pop()||'mp3').toLowerCase().replace(/[^a-z0-9]/g,'');
      const u=await up(f,'music',ext,f.type||'audio/mpeg');
      const r=await sb.from('tracks').insert({name:f.name.replace(/\.[^.]+$/,''),url:u.url,path:u.path});if(r.error)throw r.error;
      toast('Musik ditambahkan ♪');
    }catch(err){toast('Gagal: '+(err.message||'coba lagi'))}
  }
  loadAll();
};

/* ---------- simpan / unduh foto ---------- */
function saveBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}
const fname=p=>'foto-'+(p.created_at||'').slice(0,10)+'-'+String(p.id).slice(0,6)+'.'+((p.url.split('?')[0].split('.').pop()||'jpg').slice(0,4));
$('#dl').onclick=async()=>{
  const p=photos[li];if(!p)return;
  try{toast('Menyiapkan…');const r=await fetch(p.url);if(!r.ok)throw 0;saveBlob(await r.blob(),fname(p));toast('Foto disimpan ⬇')}
  catch(e){window.open(p.url,'_blank');toast('Foto dibuka di tab baru. Klik kanan atau tekan lama untuk menyimpan.')}
};
$('#dlAll').onclick=async()=>{
  if(!photos.length)return toast('Belum ada foto');
  if(!window.JSZip)return toast('Fitur zip belum termuat, muat ulang halaman lalu coba lagi');
  const zip=new JSZip();let n=0;
  for(const p of photos){
    try{const r=await fetch(p.url);if(!r.ok)throw 0;zip.file(fname(p),await r.blob());n++}catch(e){}
    toast('Menyiapkan '+n+'/'+photos.length+'… jangan tutup halaman');
  }
  if(!n)return toast('Gagal mengunduh foto');
  toast('Membuat file zip…');
  saveBlob(await zip.generateAsync({type:'blob',compression:'STORE'}),'kenangan-kita.zip');
  toast(n+' foto diunduh ⬇');
};

/* ---------- hujan love ---------- */
let rainOn=!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
try{const v=localStorage.getItem('rain');if(v)rainOn=v==='on'}catch(e){}
const rainBox=$('#rain'),rainCols=['#ff4d9d','#ff8fc4','#ff2d7a','#ffb3d9','#e91e63'];
function rainLabel(){$('#rainBtn').textContent='💗 Hujan Love: '+(rainOn?'nyala':'mati')}
function drop(){
  if(!rainOn||document.hidden||rainBox.childElementCount>40)return;
  const h=document.createElement('span');h.className='rh';
  h.textContent=Math.random()<.2?'💗':'♥';

  h.style.color=rainCols[Math.floor(Math.random()*rainCols.length)];
  h.style.animationDuration=(6+Math.random()*7)+'s';
  h.style.setProperty('--dx',(Math.random()*120-60)+'px');
  h.style.setProperty('--rot',(Math.random()*120-60)+'deg');
  h.addEventListener('animationend',()=>h.remove());
  rainBox.appendChild(h);
}
setInterval(drop,350);
$('#rainBtn').onclick=()=>{rainOn=!rainOn;try{localStorage.setItem('rain',rainOn?'on':'off')}catch(e){}if(!rainOn)rainBox.innerHTML='';rainLabel()};
rainLabel();

/* ---------- jadian, keterangan foto, putar kenangan ---------- */
function errMsg(e){const m=(e&&e.message)||'coba lagi';return /column|schema cache/i.test(m)?'Kolom baru belum ada. Jalankan setup2.sql di Supabase dulu.':'Gagal: '+m}
function parseD(s){const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])}
function fmtDate(s){return parseD(s).toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'})}
function calcD(a,t){
  const days=Math.round((t-a)/864e5);
  let y=t.getFullYear()-a.getFullYear(),m=t.getMonth()-a.getMonth(),d=t.getDate()-a.getDate();
  if(d<0){m--;d+=new Date(t.getFullYear(),t.getMonth(),0).getDate()}
  if(m<0){y--;m+=12}
  let ny=t.getFullYear()-a.getFullYear(),nx=new Date(a.getFullYear()+ny,a.getMonth(),a.getDate());
  if(nx<t){ny++;nx=new Date(a.getFullYear()+ny,a.getMonth(),a.getDate())}
  const pv=new Date(a.getFullYear()+ny-1,a.getMonth(),a.getDate()),left=Math.round((nx-t)/864e5);
  const frac=Math.max(0,Math.min(1,(t-(pv<a?a:pv))/(nx-(pv<a?a:pv))));
  return {days,y,m,d,ny,left,frac:isFinite(frac)?frac:1};
}
const reduceMo=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
let shownDays=null,burstDone=false;
function countUp(el,to){
  if(reduceMo||to<=0){el.textContent=to;return}
  const t0=performance.now();
  (function f(t){const k=Math.min(1,(t-t0)/1600),e=1-Math.pow(1-k,3);el.textContent=Math.round(to*e);if(k<1)requestAnimationFrame(f)})(t0);
}
function burst(n){
  const c=document.querySelector('#days .dcard');if(!c||reduceMo)return;
  const ch=['♥','💗','✨'];
  for(let i=0;i<n;i++){
    const h=document.createElement('span');h.className='bh';h.textContent=ch[Math.floor(Math.random()*ch.length)];
    const ang=Math.random()*Math.PI*2,r=60+Math.random()*110;
    h.style.setProperty('--bx',Math.cos(ang)*r+'px');h.style.setProperty('--by',(Math.sin(ang)*r-30)+'px');
    h.style.setProperty('--br',(Math.random()*120-60)+'deg');
    h.style.fontSize=(14+Math.random()*16)+'px';h.style.animationDelay=(Math.random()*.25)+'s';
    h.addEventListener('animationend',()=>h.remove());c.appendChild(h);
  }
}
function renderDays(){
  const el=$('#days');
  if(!settings.anniv){el.textContent='';shownDays=null;$('#annivBtn').textContent='📅 Atur tanggal jadian';return}
  $('#annivBtn').textContent='📅 Ubah tanggal jadian';
  const a=parseD(settings.anniv),n=new Date(),t=new Date(n.getFullYear(),n.getMonth(),n.getDate());
  let c=el.querySelector('.dcard');
  if(!c){
    el.innerHTML='';c=document.createElement('div');c.className='dcard';
    c.innerHTML='<div class="dheart">💗</div><div class="dnum">0</div><div class="dlbl"></div><div class="dsub"></div><div class="dbar"><i></i></div><div class="dnext"></div>';
    c.onclick=()=>burst(16);el.appendChild(c);shownDays=null;
  }
  const num=c.querySelector('.dnum'),lbl=c.querySelector('.dlbl'),sub=c.querySelector('.dsub'),bar=c.querySelector('.dbar'),fill=c.querySelector('.dbar i'),nxt=c.querySelector('.dnext');
  const r=calcD(a,t);
  if(r.days<0){
    lbl.textContent='hari lagi menuju hari jadian';sub.textContent='';nxt.textContent='';bar.style.display='none';c.classList.remove('party');
    if(shownDays!==r.days){shownDays=r.days;countUp(num,-r.days)}
    return;
  }
  bar.style.display='';lbl.textContent='hari bersama';
  sub.textContent=[r.y?r.y+' tahun':'',r.m?r.m+' bulan':'',r.d?r.d+' hari':''].filter(Boolean).join(' ');
  nxt.textContent=r.days===0?'Hari ini hari jadian kalian 💗':(r.left===0?'🎉 Selamat anniversary ke-'+r.ny+'!':r.left+' hari lagi menuju anniversary ke-'+r.ny);
  const party=r.days===0||r.left===0;c.classList.toggle('party',party);
  const w=Math.round(r.frac*100)+'%';
  if(shownDays!==r.days){
    shownDays=r.days;countUp(num,r.days);fill.style.width='0';
    requestAnimationFrame(()=>requestAnimationFrame(()=>{fill.style.width=w}));
  }else fill.style.width=w;
  if(party&&!burstDone){burstDone=true;setTimeout(()=>burst(34),900)}
}
setInterval(renderDays,3600000);
$('#annivBtn').onclick=()=>{const r=$('#annivRow');r.style.display=r.style.display==='flex'?'none':'flex';$('#annivIn').value=settings.anniv||''};
$('#annivSave').onclick=async()=>{
  if(!sb)return toast(NOCONN);const v=$('#annivIn').value;if(!v)return toast('Pilih tanggalnya dulu');
  const r=await sb.from('settings').update({anniv:v}).eq('id',1);
  if(r.error)return toast(errMsg(r.error));
  $('#annivRow').style.display='none';toast('Tanggal jadian tersimpan 💗');loadAll();
};
let editing=false;
function showLb(){
  if(!photos.length){$('#lb').style.display='none';return}
  li=(li+photos.length)%photos.length;const p=photos[li];$('#limg').src=p.url;
  $('#lcap').textContent=[p.caption,p.taken_at?fmtDate(p.taken_at):''].filter(Boolean).join(' · ');
  if(!editing)$('#capEdit').style.display='none';
}
$('#lprev').onclick=()=>{editing=false;li--;showLb()};
$('#lnext').onclick=()=>{editing=false;li++;showLb()};
$('#lclose').onclick=()=>{editing=false;$('#lb').style.display='none'};
$('#capBtn').onclick=()=>{
  const p=photos[li];if(!p)return;editing=!editing;
  $('#capEdit').style.display=editing?'flex':'none';
  if(editing){$('#capIn').value=p.caption||'';$('#dateIn').value=p.taken_at||''}
};
$('#capSave').onclick=async()=>{
  const p=photos[li];if(!p||!sb)return;
  const r=await sb.from('photos').update({caption:$('#capIn').value.trim()||null,taken_at:$('#dateIn').value||null}).eq('id',p.id);
  if(r.error)return toast(errMsg(r.error));
  editing=false;toast('Keterangan tersimpan 💗');loadAll();
};
let mArr=[],mi=0,mTop=0,mt=null,mPlay=true,mStarted=false;
function mShow(){
  if(!mArr.length)return;
  mi=(mi+mArr.length)%mArr.length;const p=mArr[mi];
  const l=[$('#mA'),$('#mB')];mTop=1-mTop;const n=l[mTop],o=l[1-mTop],pre=new Image();
  pre.onload=pre.onerror=()=>{
    n.src=p.url;n.classList.add('on');o.classList.remove('on');
    $('#mcap').textContent=[p.caption,p.taken_at?fmtDate(p.taken_at):''].filter(Boolean).join(' · ');
  };
  pre.src=p.url;
}
function mTick(){clearInterval(mt);mt=setInterval(()=>{mi++;mShow()},6000)}
function mOpen(){
  if(!photos.length)return toast('Belum ada foto');
  mArr=[...photos].sort((a,b)=>String(a.taken_at||a.created_at||'').localeCompare(String(b.taken_at||b.created_at||'')));
  mi=0;mTop=0;mPlay=true;$('#mpp').textContent='⏸';$('#mem').style.display='block';
  $('#mA').classList.remove('on');$('#mB').classList.remove('on');
  mShow();mTick();mStarted=!playing;if(!playing)play();
}
function mClose(){clearInterval(mt);$('#mem').style.display='none';if(mStarted)pause();mStarted=false}
$('#memBtn').onclick=mOpen;$('#mx').onclick=mClose;
$('#mnext').onclick=()=>{mi++;mShow();if(mPlay)mTick()};
$('#mprev').onclick=()=>{mi--;mShow();if(mPlay)mTick()};
$('#mpp').onclick=()=>{mPlay=!mPlay;$('#mpp').textContent=mPlay?'⏸':'▶';if(mPlay)mTick();else clearInterval(mt)};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#mem').style.display==='block')mClose()});

/* ---------- menu Lainnya ---------- */
function closeMenu(){$('#menu').classList.remove('open');$('#menuBtn').textContent='⋯ Lainnya'}
$('#menuBtn').onclick=()=>{const o=$('#menu').classList.toggle('open');$('#menuBtn').textContent=o?'✕ Tutup menu':'⋯ Lainnya'};
$('#menu').addEventListener('click',e=>{
  const b=e.target.closest('.mi');if(!b)return;
  if(b.id!=='annivBtn'&&b.id!=='rainBtn')closeMenu();
  if(b.id==='trashBtn')setTimeout(()=>{if($('#trash').style.display==='block')$('#trash').scrollIntoView({behavior:'smooth',block:'start'})},60);
});
document.addEventListener('click',e=>{if($('#menu').classList.contains('open')&&!e.target.closest('#menu')&&!e.target.closest('#menuBtn'))closeMenu()});

if(ss('ok')==='1')unlock();
render();
</script>
